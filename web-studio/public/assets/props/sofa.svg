<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 -340 440 360" width="440" height="360">
  <!-- Wooden peg legs -->
  <g stroke="#141414" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="-160,0 -150,-35 -130,-35 -145,0" fill="#B4773A" />
    <polygon points="145,0 130,-35 150,-35 160,0" fill="#B4773A" />
  </g>
  <!-- Backrest -->
  <rect x="-170" y="-320" width="340" height="220" rx="40" ry="40" fill="#1D70E2" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>
  <!-- Seat Cushion -->
  <rect x="-180" y="-170" width="360" height="140" rx="30" ry="30" fill="#2563EB" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>
  <!-- Armrest -->
  <rect x="-205" y="-220" width="70" height="180" rx="35" ry="35" fill="#3B82F6" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>
  <line x1="-135" y1="-80" x2="160" y2="-80" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
</svg>
