<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -210 320 420" width="320" height="420">
  <defs>
    <!-- Drop shadow beneath jar -->
    <radialGradient id="jarBaseShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass transparency and subtle refractive tint -->
    <linearGradient id="jarGlassFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="15%" stop-color="#E0F2FE" stop-opacity="0.10"/>
      <stop offset="75%" stop-color="#F0F9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Shiny diagonal reflection streak -->
    <linearGradient id="specularGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Lid 3D gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- 1. Soft contact shadow on ground -->
  <ellipse cx="0" cy="195" rx="145" ry="16" fill="url(#jarBaseShadow)" />

  <!-- 2. Main Glass Jar Body (Thick walls, round bottom edges) -->
  <rect
    x="-140"
    y="-145"
    width="280"
    height="335"
    rx="36"
    ry="36"
    fill="url(#jarGlassFill)"
    stroke="#0284C7"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- 3. Bottom Glass Thickness / Base Rim -->
  <path
    d="M -115,160 Q 0,185 115,160"
    stroke="#0369A1"
    stroke-width="8"
    fill="none"
    stroke-linecap="round"
  />

  <!-- 4. Crisp Glass Specular Highlights (Left vertical streak & diagonal gleam) -->
  <!-- Left curved rim reflection -->
  <path
    d="M -122,-120 L -122,140"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.85"
  />
  <!-- Diagonal glass reflection polygon -->
  <path
    d="M -90,-125 L -55,-125 L -105,145 L -120,145 Z"
    fill="url(#specularGleam)"
    opacity="0.6"
  />
  <!-- Right edge subtle glint -->
  <path
    d="M 122,-110 L 122,80"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.65"
  />

  <!-- 5. Jar Neck Lip (Glass collar under lid) -->
  <rect
    x="-125"
    y="-158"
    width="250"
    height="18"
    rx="8"
    fill="#BAE6FD"
    stroke="#0284C7"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- 6. Heavy Screw Lid with Defined Thread Ridges -->
  <g id="jar-screw-lid">
    <!-- Lid Body -->
    <rect
      x="-152"
      y="-200"
      width="304"
      height="52"
      rx="14"
      ry="14"
      fill="url(#lidGrad)"
      stroke="#141414"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <!-- Top Lid Bevel / Rim -->
    <rect
      x="-144"
      y="-195"
      width="288"
      height="14"
      rx="7"
      fill="#FDBA74"
      opacity="0.8"
    />
    <!-- Vertical Screw Thread Ridges (Pronounced 3D Grooves) -->
    <g stroke="#141414" stroke-width="6" stroke-linecap="round">
      <line x1="-110" y1="-188" x2="-110" y2="-154" />
      <line x1="-66" y1="-188" x2="-66" y2="-154" />
      <line x1="-22" y1="-188" x2="-22" y2="-154" />
      <line x1="22" y1="-188" x2="22" y2="-154" />
      <line x1="66" y1="-188" x2="66" y2="-154" />
      <line x1="110" y1="-188" x2="110" y2="-154" />
    </g>
  </g>
</svg>
