<svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a67c52;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Ground Shadow -->
  <ellipse cx="200" cy="380" rx="85" ry="12" fill="#000000" opacity="0.15"/>

  <!-- Layer 2: Main Stand/Frame -->
  <path d="M120 380 L140 100 L260 100 L280 380 Z" fill="url(#frameGrad)" stroke="#1A1A1A" stroke-width="10" stroke-linejoin="round"/>
  
  <!-- Layer 3: Main Board Surface -->
  <rect x="150" y="130" width="100" height="220" fill="url(#boardGrad)" stroke="#1A1A1A" stroke-width="8" rx="5"/>
  
  <!-- Layer 4: Ambient Occlusion (Inner shading) -->
  <rect x="150" y="130" width="100" height="220" fill="#000000" opacity="0.1" rx="5"/>

  <!-- Layer 5: Data Visuals (Accent Details) -->
  <path d="M165 310 L190 260 L215 285 L235 220" fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
  <circle cx="165" cy="310" r="6" fill="#e63946"/>
  <circle cx="190" cy="260" r="6" fill="#e63946"/>
  <circle cx="215" cy="285" r="6" fill="#e63946"/>
  <circle cx="235" cy="220" r="6" fill="#e63946"/>
  <line x1="165" y1="320" x2="235" y2="320" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Layer 6: Specular Highlights -->
  <path d="M158 135 L242 135" stroke="#ffffff" stroke-width="6" opacity="0.6" stroke-linecap="round"/>
  <path d="M125 105 L275 105" stroke="#ffffff" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
</svg>