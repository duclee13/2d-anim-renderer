<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shineGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Layer 1: Ground Shadow -->
  <ellipse cx="200" cy="380" rx="90" ry="15" fill="#000000" opacity="0.15"/>

  <!-- Layer 2: Main Body -->
  <path d="M 120 180 Q 200 160 280 180 L 270 380 Q 200 360 130 380 Z" fill="url(#labelGrad)" stroke="#1A1A1A" stroke-width="10" stroke-linejoin="round"/>

  <!-- Layer 3: Ambient Occlusion -->
  <path d="M 130 380 Q 200 360 270 380 L 270 365 Q 200 345 130 365 Z" fill="#E6AC00" opacity="0.3"/>

  <!-- Layer 4: Specular Highlight -->
  <path d="M 140 190 L 260 190 Q 260 220 250 220 L 150 220 Q 140 220 140 190 Z" fill="url(#shineGrad)" opacity="0.5"/>

  <!-- Layer 5: Accent Detail (The Label Text Box) -->
  <rect x="155" y="250" width="90" height="80" rx="10" ry="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6"/>
  <line x1="165" y1="270" x2="235" y2="270" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="290" x2="235" y2="290" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="310" x2="210" y2="310" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

  <!-- Layer 6: Decorative Pin/Grommet -->
  <circle cx="200" cy="180" r="12" fill="#F44336" stroke="#1A1A1A" stroke-width="6"/>
  <circle cx="200" cy="180" r="4" fill="#1A1A1A"/>
</svg>