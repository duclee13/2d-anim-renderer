<svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Layer 1: Ground contact shadow -->
  <ellipse cx="200" cy="380" rx="60" ry="10" fill="#000000" opacity="0.2"/>

  <!-- Layer 2: Main Body -->
  <path d="M200 40 L280 150 H230 V380 H170 V150 H120 Z" fill="url(#arrowGrad)" stroke="#1A1A1A" stroke-width="10" stroke-linejoin="round"/>

  <!-- Layer 3: Ambient Occlusion -->
  <path d="M200 40 L280 150 H240 L200 80 Z" fill="#000" opacity="0.15"/>
  <path d="M170 380 V150 H130 L170 380 Z" fill="#000" opacity="0.25"/>

  <!-- Layer 4: Specular Highlights -->
  <path d="M200 55 L260 140 H235 L200 70 Z" fill="#FFF" opacity="0.4"/>
  <path d="M175 160 V370 H185 V160 Z" fill="#FFF" opacity="0.3"/>

  <!-- Layer 5: Accent Detail (Bolt/Rivets) -->
  <circle cx="200" cy="220" r="12" fill="#FF4500" stroke="#1A1A1A" stroke-width="6"/>
  <circle cx="200" cy="220" r="4" fill="#FFF"/>

  <!-- Layer 6: Stroke reinforcement -->
  <path d="M200 40 L280 150 H230 V380 H170 V150 H120 Z" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>