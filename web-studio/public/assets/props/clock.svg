<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -100 180 190" width="180" height="190">
  <!-- Ground contact shadow -->
  <ellipse cx="0" cy="80" rx="55" ry="8" fill="#000000" opacity="0.25" />

  <!-- Peg feet -->
  <g stroke="#141414" stroke-width="8" stroke-linecap="round">
    <line x1="-35" y1="45" x2="-45" y2="78" />
    <line x1="35" y1="45" x2="45" y2="78" />
  </g>

  <!-- Twin Bells -->
  <circle cx="-42" cy="-48" r="22" fill="#E2E8F0" stroke="#141414" stroke-width="8" />
  <circle cx="42" cy="-48" r="22" fill="#E2E8F0" stroke="#141414" stroke-width="8" />
  <path d="M -15,-65 C -15,-80 15,-80 15,-65" fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round" />

  <!-- Main Clock Body -->
  <circle cx="0" cy="0" r="62" fill="#3B82F6" stroke="#141414" stroke-width="10" />
  <!-- White Dial Face -->
  <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#141414" stroke-width="6" />

  <!-- Clock Hands (10:10) -->
  <line x1="0" y1="0" x2="-18" y2="-18" stroke="#141414" stroke-width="6" stroke-linecap="round" />
  <line x1="0" y1="0" x2="24" y2="-12" stroke="#141414" stroke-width="5" stroke-linecap="round" />
  <circle cx="0" cy="0" r="5" fill="#EF4444" />
</svg>
