<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -140 240 280" width="240" height="280">
  <!-- Potted Plant in 2D Cartoon Explainer Style -->
  <!-- Plant Leaves -->
  <g id="plant-leaves" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center tall leaf -->
    <path d="M 0 10 Q -25 -70 0 -120 Q 25 -70 0 10 Z" fill="#22C55E" />
    <path d="M 0 10 L 0 -115" stroke="#15803D" stroke-width="5" />
    <!-- Left leaves -->
    <path d="M -15 15 Q -70 -20 -80 -80 Q -35 -50 -15 15 Z" fill="#16A34A" />
    <path d="M -15 15 Q -50 -25 -75 -75" stroke="#15803D" stroke-width="5" />
    <path d="M -20 20 Q -95 10 -90 -40 Q -50 -15 -20 20 Z" fill="#22C55E" />
    <!-- Right leaves -->
    <path d="M 15 15 Q 70 -20 80 -80 Q 35 -50 15 15 Z" fill="#16A34A" />
    <path d="M 15 15 Q 50 -25 75 -75" stroke="#15803D" stroke-width="5" />
    <path d="M 20 20 Q 95 10 90 -40 Q 50 -15 20 20 Z" fill="#22C55E" />
  </g>

  <!-- Flower Pot Rim -->
  <rect x="-65" y="20" width="130" height="24" rx="8" fill="#F97316" stroke="#141414" stroke-width="8" />

  <!-- Flower Pot Body -->
  <polygon points="-55,44 55,44 42,125 -42,125" fill="#EA580C" stroke="#141414" stroke-width="8" stroke-linejoin="round" />

  <!-- Pot Highlight Accent -->
  <path d="M -30 55 L -20 115" stroke="#FB923C" stroke-width="6" stroke-linecap="round" />
</svg>
