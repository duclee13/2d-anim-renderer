    <ellipse cx="0" cy="0" rx="550" ry="180" fill="#277028" stroke="#141414" stroke-width="10" />
    <g stroke="#141414" stroke-width="8" stroke-linejoin="round" fill="#38A137">
      <path d="M -300,0 Q -270,-280 -250,-380 Q -210,-280 -180,0 Z" />
      <path d="M -220,0 Q -190,-350 -160,-480 Q -120,-350 -90,0 Z" fill="#2E7D32" />
      <path d="M -130,0 Q -90,-320 -70,-420 Q -40,-320 0,0 Z" />
