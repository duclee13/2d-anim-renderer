    <g stroke="#F59E0B" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-140" x2="0" y2="-175" />
      <line x1="0" y1="140" x2="0" y2="175" />
      <line x1="-140" y1="0" x2="-175" y2="0" />
      <line x1="140" y1="0" x2="175" y2="0" />
      <line x1="-100" y1="-100" x2="-125" y2="-125" />
      <line x1="100" y1="-100" x2="125" y2="-125" />
      <line x1="-100" y1="100" x2="-125" y2="125" />
      <line x1="100" y1="100" x2="125" y2="125" />
    </g>
    <circle cx="0" cy="0" r="115" fill="#FBBF24" stroke="#141414" stroke-width="10" />
  </g>
  <!-- Clouds -->
  <g transform="translate(500, 220)">
    <path d="M 0,40 Q -40,40 -40,10 Q -40,-30 0,-30 Q 30,-70 80,-50 Q 140,-70 170,-20 Q 210,-20 210,20 Q 210,40 180,40 Z" fill="#FFFFFF" />
