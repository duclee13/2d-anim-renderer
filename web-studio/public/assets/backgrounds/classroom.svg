<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <!-- Classroom Wall -->
  <rect x="0" y="0" width="2560" height="1120" fill="#E2E8F0" />

  <!-- Wall Clock -->
  <g transform="translate(1280, 150)">
    <circle cx="0" cy="0" r="75" fill="#FFFFFF" stroke="#141414" stroke-width="10" />
    <circle cx="0" cy="0" r="8" fill="#141414" />
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#141414" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="0" x2="30" y2="0" stroke="#141414" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Big Classroom Blackboard -->
  <g transform="translate(1280, 560)">
    <!-- Wooden Frame -->
    <rect x="-820" y="-310" width="1640" height="620" rx="14" fill="#854D0E" stroke="#141414" stroke-width="14" />
    <!-- Dark Green Board -->
    <rect x="-790" y="-280" width="1580" height="560" rx="8" fill="#1E3A2F" stroke="#141414" stroke-width="8" />
    <!-- Chalk Tray -->
    <rect x="-820" y="310" width="1640" height="24" rx="4" fill="#A16207" stroke="#141414" stroke-width="8" />
    <!-- Chalk writing & doodles -->
    <text x="-650" y="-140" fill="#FEF08A" font-size="52" font-weight="900" font-family="sans-serif">E = mc²</text>
    <text x="-650" y="-30" fill="#FFFFFF" font-size="44" font-weight="700" font-family="sans-serif">a² + b² = c²</text>
    <text x="-650" y="80" fill="#6EE7B7" font-size="44" font-weight="700" font-family="sans-serif">f(x) = sin(x)</text>
    <!-- Geometric shapes on board -->
    <polygon points="400,-150 560,100 240,100" fill="none" stroke="#FDE047" stroke-width="8" stroke-linejoin="round" />
    <circle cx="620" cy="-60" r="70" fill="none" stroke="#93C5FD" stroke-width="8" />
  </g>

  <!-- Classroom Floor (y = 1120 to 1440) -->
  <rect x="0" y="1080" width="2560" height="40" fill="#CBD5E1" stroke="#141414" stroke-width="8" />
  <line x1="0" y1="1120" x2="2560" y2="1120" stroke="#141414" stroke-width="12" />
  <rect x="0" y="1120" width="2560" height="320" fill="#94A3B8" />
  <!-- Floor Grid Lines -->
  <g stroke="#64748B" stroke-width="6" opacity="0.6">
    <line x1="400" y1="1120" x2="200" y2="1440" />
    <line x1="900" y1="1120" x2="800" y2="1440" />
    <line x1="1400" y1="1120" x2="1400" y2="1440" />
    <line x1="1900" y1="1120" x2="2000" y2="1440" />
    <line x1="2400" y1="1120" x2="2600" y2="1440" />
  </g>
</svg>
