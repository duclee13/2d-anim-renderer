<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <!-- Cozy Warm Evening Wall -->
  <rect x="0" y="0" width="2560" height="1120" fill="#EADFCB" />

  <!-- High-Detail 2K Window Night with Crescent Moon & Stars (Scaled 1.8x) -->
  <g id="window-night" transform="translate(240, 160)">
    <!-- Outer wooden casing -->
    <rect x="-14" y="-14" width="588" height="488" rx="16" fill="#D7C9B6" stroke="#141414" stroke-width="12" />
    <!-- Night sky background -->
    <rect x="0" y="0" width="560" height="460" rx="10" fill="#0F172A" stroke="#141414" stroke-width="8" />

    <!-- Crescent Moon -->
    <path
      d="M 430,90 A 45,45 0 1,0 430,170 A 35,35 0 0,1 430,90 Z"
      fill="#FDE047"
      stroke="#EAB308"
      stroke-width="3"
    />
    <!-- Moon glow -->
    <circle cx="410" cy="130" r="50" fill="#FDE047" opacity="0.15" />

    <!-- Twinkling Stars -->
    <circle cx="90" cy="90" r="6" fill="#FFFFFF" opacity="0.9" />
    <circle cx="150" cy="270" r="7" fill="#FFFFFF" opacity="0.9" />
    <circle cx="370" cy="310" r="6" fill="#FFFFFF" opacity="0.8" />
    <circle cx="210" cy="140" r="4.5" fill="#FFFFFF" opacity="0.75" />
    <circle cx="480" cy="230" r="5" fill="#FFFFFF" opacity="0.85" />
    <!-- 4-point star glint -->
    <path d="M 120,180 Q 120,170 125,170 Q 120,170 120,160 Q 120,170 115,170 Q 120,170 120,180 Z" fill="#FEF08A" />

    <!-- Window frame dividers -->
    <line x1="280" y1="0" x2="280" y2="460" stroke="#141414" stroke-width="10" />
    <line x1="0" y1="230" x2="560" y2="230" stroke="#141414" stroke-width="10" />
  </g>

  <!-- Lowered Baseboard & Warm Wood Floor (y = 1080 to 1440) -->
  <rect x="0" y="1080" width="2560" height="40" fill="#FFFFFF" stroke="#141414" stroke-width="8" />
  <line x1="0" y1="1120" x2="2560" y2="1120" stroke="#141414" stroke-width="12" />
  <rect x="0" y="1120" width="2560" height="320" fill="#C89D78" />
  <!-- Diagonal floor planks -->
  <g stroke="#B0835D" stroke-width="6" stroke-linecap="round">
    <line x1="380" y1="1120" x2="310" y2="1440" />
    <line x1="950" y1="1120" x2="870" y2="1440" />
    <line x1="1520" y1="1120" x2="1430" y2="1440" />
    <line x1="2090" y1="1120" x2="2000" y2="1440" />
  </g>
</svg>
