<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <!-- Sky -->
  <rect x="0" y="0" width="2560" height="920" fill="#BAE6FD" />

  <!-- Cartoon City Buildings Background -->
  <g stroke="#141414" stroke-width="10" stroke-linejoin="round">
    <!-- Building 1 (Pink/Coral) -->
    <rect x="120" y="280" width="340" height="740" fill="#FDA4AF" />
    <g fill="#FFFFFF" stroke="#141414" stroke-width="6">
      <rect x="170" y="340" width="80" height="100" rx="8" />
      <rect x="320" y="340" width="80" height="100" rx="8" />
      <rect x="170" y="520" width="80" height="100" rx="8" />
      <rect x="320" y="520" width="80" height="100" rx="8" />
      <rect x="170" y="700" width="80" height="100" rx="8" />
      <rect x="320" y="700" width="80" height="100" rx="8" />
    </g>

    <!-- Building 2 (Teal) -->
    <rect x="520" y="160" width="420" height="860" fill="#5EEAD4" />
    <g fill="#FFFFFF" stroke="#141414" stroke-width="6">
      <rect x="570" y="230" width="90" height="120" rx="8" />
      <rect x="710" y="230" width="90" height="120" rx="8" />
      <rect x="570" y="440" width="90" height="120" rx="8" />
      <rect x="710" y="440" width="90" height="120" rx="8" />
      <rect x="570" y="650" width="90" height="120" rx="8" />
      <rect x="710" y="650" width="90" height="120" rx="8" />
    </g>

    <!-- Building 3 (Yellow) -->
    <rect x="1000" y="240" width="380" height="780" fill="#FDE047" />
    <g fill="#FFFFFF" stroke="#141414" stroke-width="6">
      <circle cx="1120" cy="360" r="45" />
      <circle cx="1260" cy="360" r="45" />
      <circle cx="1120" cy="540" r="45" />
      <circle cx="1260" cy="540" r="45" />
      <circle cx="1120" cy="720" r="45" />
      <circle cx="1260" cy="720" r="45" />
    </g>

    <!-- Building 4 (Purple) -->
    <rect x="1440" y="180" width="480" height="840" fill="#C4B5FD" />
    <g fill="#FFFFFF" stroke="#141414" stroke-width="6">
      <rect x="1510" y="260" width="100" height="130" rx="8" />
      <rect x="1690" y="260" width="100" height="130" rx="8" />
      <rect x="1510" y="480" width="100" height="130" rx="8" />
      <rect x="1690" y="480" width="100" height="130" rx="8" />
    </g>

    <!-- Building 5 (Orange) -->
    <rect x="1980" y="310" width="450" height="710" fill="#FDBA74" />
    <g fill="#FFFFFF" stroke="#141414" stroke-width="6">
      <rect x="2060" y="400" width="80" height="110" rx="8" />
      <rect x="2220" y="400" width="80" height="110" rx="8" />
      <rect x="2060" y="600" width="80" height="110" rx="8" />
      <rect x="2220" y="600" width="80" height="110" rx="8" />
    </g>
  </g>

  <!-- Sidewalk Pavement (y = 1020 to 1120) -->
  <rect x="0" y="1020" width="2560" height="100" fill="#E2E8F0" stroke="#141414" stroke-width="10" />
  <g stroke="#94A3B8" stroke-width="6">
    <line x1="400" y1="1020" x2="400" y2="1120" />
    <line x1="800" y1="1020" x2="800" y2="1120" />
    <line x1="1200" y1="1020" x2="1200" y2="1120" />
    <line x1="1600" y1="1020" x2="1600" y2="1120" />
    <line x1="2000" y1="1020" x2="2000" y2="1120" />
    <line x1="2400" y1="1020" x2="2400" y2="1120" />
  </g>

  <!-- Asphalt Road (y = 1120 to 1440) -->
  <line x1="0" y1="1120" x2="2560" y2="1120" stroke="#141414" stroke-width="12" />
  <rect x="0" y="1120" width="2560" height="320" fill="#334155" />
  <!-- Yellow Dashed Road Lines -->
  <g stroke="#FACC15" stroke-width="14" stroke-dasharray="140 100" stroke-linecap="round">
    <line x1="0" y1="1280" x2="2560" y2="1280" />
  </g>
</svg>
