<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <!-- Wall -->
  <rect x="0" y="0" width="2560" height="1040" fill="#F8EFE3" />
  <!-- Window Day -->
  <g transform="translate(340, 260)">
    <rect x="0" y="0" width="360" height="320" rx="8" fill="#BAE6FD" stroke="#141414" stroke-width="10" />
    <line x1="180" y1="0" x2="180" y2="320" stroke="#141414" stroke-width="8" />
    <line x1="0" y1="160" x2="360" y2="160" stroke="#141414" stroke-width="8" />
  </g>
  <!-- Potted Plant on Table -->
  <g transform="translate(160, 1040)">
    <g stroke="#141414" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-140" y="-320" width="280" height="26" rx="4" fill="#CE9156" />
      <line x1="-110" y1="-294" x2="-110" y2="0" />
      <line x1="-90" y1="-294" x2="-90" y2="0" stroke="#B4773A" />
      <line x1="110" y1="-294" x2="110" y2="0" />
      <line x1="90" y1="-294" x2="90" y2="0" stroke="#B4773A" />
    </g>
    <g transform="translate(0, -320)">
      <polygon points="-70,-100 70,-100 50,0 -50,0" fill="#FFFFFF" stroke="#141414" stroke-width="10" stroke-linejoin="round" />
      <g fill="#22C55E" stroke="#141414" stroke-width="9" stroke-linejoin="round">
        <path d="M 0,-100 C -30,-220 0,-300 0,-300 C 0,-300 30,-220 0,-100 Z" fill="#15803D" />
        <path d="M -20,-100 C -90,-180 -110,-240 -110,-240 C -110,-240 -30,-200 -20,-100 Z" />
        <path d="M 20,-100 C 90,-180 110,-240 110,-240 C 110,-240 30,-200 20,-100 Z" />
        <path d="M -30,-100 C -140,-130 -130,-170 -130,-170 C -130,-170 -50,-150 -30,-100 Z" fill="#16A34A" />
        <path d="M 30,-100 C 140,-130 130,-170 130,-170 C 130,-170 50,-150 30,-100 Z" fill="#16A34A" />
      </g>
    </g>
  </g>
  <!-- Baseboard & Wooden Floor -->
  <rect x="0" y="1000" width="2560" height="40" fill="#FFFFFF" stroke="#141414" stroke-width="6" />
  <line x1="0" y1="1040" x2="2560" y2="1040" stroke="#141414" stroke-width="10" />
  <rect x="0" y="1040" width="2560" height="400" fill="#E8C39E" />
  <g stroke="#D4A77D" stroke-width="5" stroke-linecap="round">
    <line x1="320" y1="1040" x2="260" y2="1440" />
    <line x1="850" y1="1040" x2="780" y2="1440" />
    <line x1="1400" y1="1040" x2="1320" y2="1440" />
    <line x1="1950" y1="1040" x2="1880" y2="1440" />
  </g>
